name: Build & Release

# Triggers: runs when you push a version tag like v1.1.0
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (for Tauri CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Rust (stable)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust build artifacts to speed up future builds
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 5. Install Node dependencies (Tauri CLI)
      - name: Install Node dependencies
        run: npm install

      # 6. Build Tauri App & Publish Release with updater artifacts (latest.json, .sig, .exe, .msi)
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flowdoro ${{ github.ref_name }}'
          releaseBody: 'See the release assets below.'
          releaseDraft: false
          prerelease: false
