<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pomobodo — a Pomodoro timer, todo list, and ambient video player in one app." />
    <title>Pomobodo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ═══════════════════════════════════════════
         MOSAIC LAYOUT — No header, clean grid
         Left 60%: video (top) + todos (bottom)
         Right 40%: timer (full height)
    ════════════════════════════════════════════ -->
    <div id="app">

      <!-- ── Main Mosaic Grid ── -->
      <main id="mosaic-grid">

        <!-- ▌LEFT COLUMN ▌ -->
        <div id="left-column">

          <!-- Video Player Panel -->
          <section id="video-panel" aria-label="Video Player">
            <div id="video-container">
              <!-- Ambient video player (keyboard-isolated) -->
              <video id="video-player" loop muted preload="metadata" tabindex="-1"></video>
              <!-- YouTube iframe (hidden by default) -->
              <iframe id="youtube-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>

              <!-- Settings overlay (hidden by default) -->
              <div id="video-settings-overlay" class="hidden">
                <div id="video-settings-inner">
                  <div id="video-settings-header">
                    <h3>Video Library</h3>
                    <button id="btn-close-settings" aria-label="Close settings">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                  </div>

                  <!-- YouTube URL input -->
                  <div id="youtube-input-row">
                    <input id="youtube-url-input" type="url" placeholder="Paste YouTube URL…" autocomplete="off" />
                    <button id="btn-add-youtube" aria-label="Add YouTube video" title="Add YouTube">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                  </div>

                  <!-- Video library grid -->
                  <div id="video-library-grid">
                    <!-- Dynamically populated by video.js -->
                  </div>

                  <span id="video-slot-counter">0 / 8 slots used</span>
                </div>
              </div>

              <!-- Open settings button (bottom-left, shows on hover) -->
              <button id="btn-video-settings" aria-label="Video settings" title="Video Library">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </button>

              <!-- Volume toggle (muted by default, shows on hover) -->
              <button id="btn-volume-toggle" aria-label="Toggle volume" title="Toggle sound">
                <svg id="icon-vol-muted" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                <svg id="icon-vol-on" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              </button>

              <!-- Dynamic dot selector (bottom-right) -->
              <div id="video-selector" aria-label="Choose ambient video"></div>

              <!-- Muted indicator -->
              <div id="video-hint">🔇 Ambient · Plays with timer</div>
            </div>
          </section>

          <!-- Todo List Panel -->
          <section id="todo-panel" aria-label="Todo List">
            <div id="todo-header">
              <h2 id="todo-title">Tasks</h2>
              <span id="todo-count" class="badge badge--neutral">0</span>
            </div>

            <div id="todo-input-row">
              <input
                id="todo-input"
                type="text"
                placeholder="Add a new task…"
                autocomplete="off"
                maxlength="120"
              />
              <button id="btn-add-task" aria-label="Add task">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>

            <ul id="todo-list" role="list">
              <!-- Tasks injected by todos.js -->
            </ul>

            <div id="todo-empty" aria-live="polite">
              <span class="empty-icon">✓</span>
              <p>What to do, what to do...</p>
            </div>
          </section>

        </div><!-- /left-column -->

        <!-- ▌RIGHT COLUMN — TIMER ▌ -->
        <aside id="timer-panel" aria-label="Pomodoro Timer">

          <!-- Mode tabs: Work / Break -->
          <div id="mode-tabs" role="tablist">
            <button class="mode-tab active" id="tab-work" role="tab" data-mode="work">Work</button>
            <button class="mode-tab" id="tab-break" role="tab" data-mode="break">Break</button>
          </div>

          <!-- Duration settings -->
          <div id="duration-settings">
            <div class="duration-field">
              <label for="input-work-min">Work</label>
              <input type="number" id="input-work-min" value="15" min="1" max="120" />
              <span class="duration-unit">min</span>
            </div>
            <div class="duration-divider"></div>
            <div class="duration-field">
              <label for="input-break-min">Break</label>
              <input type="number" id="input-break-min" value="5" min="1" max="60" />
              <span class="duration-unit">min</span>
            </div>
          </div>

          <!-- SVG Ring Progress -->
          <div id="timer-ring-container" role="img" aria-label="Timer progress ring">
            <svg id="timer-ring-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <!-- Background track -->
              <circle id="ring-track" cx="100" cy="100" r="88" />
              <!-- Progress arc -->
              <circle id="ring-progress" cx="100" cy="100" r="88" />
            </svg>

            <!-- Time readout inside ring -->
            <div id="timer-display">
              <span id="timer-time">15:00</span>
              <span id="timer-label">Focus</span>
            </div>
          </div>

          <!-- Controls: Restart · Start/Pause · Skip -->
          <div id="timer-controls">
            <button id="btn-restart" class="ctrl-btn ctrl-btn--secondary" title="Restart (R)" aria-label="Restart timer">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
            </button>
            <button id="btn-start-pause" class="ctrl-btn ctrl-btn--primary" title="Start/Pause (Space)" aria-label="Start timer">
              <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button id="btn-skip" class="ctrl-btn ctrl-btn--secondary" title="Skip (S)" aria-label="Skip to next phase">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>

          <!-- Stats: Work Done / Breaks Taken -->
          <div id="timer-stats">
            <div class="stat-item">
              <span class="stat-value" id="stat-work-done">0</span>
              <span class="stat-label">Work Done</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-value" id="stat-breaks-taken">0</span>
              <span class="stat-label">Breaks Taken</span>
            </div>
          </div>

          <!-- Daily counter -->
          <div id="daily-stats">
            <svg class="daily-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
            </svg>
            <span id="daily-stats-text">Today: 0 work, 0 breaks</span>
          </div>


        </aside><!-- /timer-panel -->

      </main><!-- /mosaic-grid -->
    </div><!-- /app -->
    

    <script type="module" src="/main.js"></script>
  </body>
</html>
